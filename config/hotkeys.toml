# ── TAG BINDINGS ──────────────────────────────────────────────────────────────
# Each entry auto-generates 4 bindings for that tag number:
#   SUPER + key                  → switch to tag
#   SUPER + CTRL + key           → also show this tag alongside current
#   SUPER + SHIFT + key          → send focused window to this tag
#   SUPER + CTRL + SHIFT + key   → also show window on that tag
#
# key = X11 key name    tag = 0-based index  (0 = tag 1,  8 = tag 9)

tag_keys = [
  { key="1", tag=0 },
  { key="2", tag=1 },
  { key="3", tag=2 },
  { key="4", tag=3 },
  { key="5", tag=4 },
  { key="6", tag=5 },
  { key="7", tag=6 },
  { key="8", tag=7 },
  { key="9", tag=8 },
]

